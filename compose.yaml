services:
  banco:
    image: postgres:17
    environment:
      POSTGRES_USER: eventos
      POSTGRES_DB: eventos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env da raiz}
    volumes:
      - dados_eventos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventos -d eventos"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://eventos:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@banco:5432/eventos
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no .env da raiz}
      ENDERECO_DO_APP: ${ENDERECO_DO_APP:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      banco:
        condition: service_healthy
volumes:
  dados_eventos:
